"""Minimal uData settings for the pinned CI image.

Adapted from opendatateam/docker-udata's udata.cfg, trimmed to what's
needed for a headless dataset-publish smoke test: no search index, no
front/theme plugins, fixed secrets (throwaway, ephemeral CI instance).
"""

from udata.settings import Defaults

DEBUG = False

# throwaway secrets: this uData instance only ever lives for one CI job
SECRET_KEY = "dicogis-ci-secret-key"
API_TOKEN_SECRET = "dicogis-ci-api-token-secret"

MONGODB_HOST = "mongodb://mongodb:27017/udata"

CELERY_BROKER_URL = "redis://redis:6379"
CELERY_RESULT_BACKEND = "redis://redis:6379"
CACHE_TYPE = "redis"
CACHE_REDIS_URL = "redis://redis:6379/1"

FS_PREFIX = "/s"
FS_ROOT = "/udata/fs"

URLS_ALLOW_PRIVATE = True
URLS_ALLOW_LOCAL = True
URLS_ALLOWED_TLDS = Defaults.URLS_ALLOWED_TLDS | {"local", "test"}
