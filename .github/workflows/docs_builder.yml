name: "📚 Documentation Builder"

on:
  push:
    branches:
      - master
    paths:
      - "docs/**/*"
      - ".github/workflows/docs_builder.yml"
      - "dicogis/**/*.py"

    tags:
      - "*"

  pull_request:
    branches:
        - master
    paths:
      - ".github/workflows/docs_builder.yml"
      - docs/**/*

  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-24.04
    # official GDAL image: libgdal and its Python bindings are already installed and
    # version-matched, so no apt/PPA step and no GDAL compilation.
    # Keep the tag aligned with GDAL_VERSION in the root Dockerfile.
    container:
      image: ghcr.io/osgeo/gdal:ubuntu-small-3.11.0

    steps:
      - name: Get source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # the libraries after python3-tk are the system ones PyQt6 needs to be imported (GUI modules documented by autodoc)
      - name: Install Python tooling, Tk and Qt system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-venv python3-tk libgl1 libegl1 libxkbcommon0 libdbus-1-3 libglib2.0-0t64
          gdal-config --version

      # --system-site-packages lets the venv see the image's pre-built osgeo bindings
      - name: Create virtual environment
        run: |
          python3 -m venv --system-site-packages /opt/venv
          echo "/opt/venv/bin" >> "$GITHUB_PATH"

      - name: Upgrade packaging tools
        run: python -m pip install -U pip setuptools wheel

      # this job must run before installing other dependencies to avoid listing everything
      - name: Generates dependencies graph page with pipdetree
        run: |
          python -m pip install -U "pipdeptree<3"
          echo -e "\`\`\`{mermaid}" > docs/misc/dependencies.md
          pipdeptree --exclude pip,pipdeptree,setuptools,wheel --mermaid >> docs/misc/dependencies.md
          echo -e "\`\`\`" >> docs/misc/dependencies.md

      # this job must run before installing other dependencies to avoid listing everything
      - name: Generates licenses page with pip-licences
        run: |
          python -m pip install -U "pip-licenses<5"
          pip-licenses --format=markdown --with-authors --with-description --with-urls --ignore-packages dicogis --output-file=docs/misc/licenses.md

      - name: Install project as a package
        # gui extra: PyQt6 must be importable so autodoc can document dicogis.ui
        run: python -m pip install .[doc,gui]

      - name: Build doc using Sphinx
        run: sphinx-build -b html -d docs/_build/cache -j auto -q docs docs/_build/html

      - name: Save build doc as artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/_build/html/*
          if-no-files-found: error
          retention-days: 30

      - name: Setup Pages
        uses: actions/configure-pages@v6
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
        with:
          # Upload entire repository
          path: docs/_build/html/

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master')
        uses: actions/deploy-pages@v5
