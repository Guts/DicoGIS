name: "Build 🐳 and publish container image"

# Triggers
on:
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker_builder.yml"
      - "dicogis/**/*.py"
      - "pyproject.toml"
    tags:
      - "*"

  pull_request:
    branches:
      - master
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker_builder.yml"

  workflow_dispatch:

# Globals
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Jobs definition
jobs:
  build-and-push:
    name: "🐳 Build and push"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Get source code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=master
            type=sha
            type=ref,event=pr

      - name: Build image (loaded locally for the smoke test below)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          # Provenance/SBOM attestations produce a manifest list even for a
          # single-platform `load`, which can make `docker run` resolve the
          # wrong entry (see docker/build-push-action#851/#900) — disable
          # both for this local-only smoke-test build.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Minimal integration test - version and help
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm "$IMAGE" --version
          docker run --rm "$IMAGE" --help

      - name: Push image to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
