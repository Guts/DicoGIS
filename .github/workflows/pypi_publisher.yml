name: "Build 📦 and publish to PyPI 🐍"

# Triggers
on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pypi_publisher.yml"
      - "MANIFEST.in"
      - "pyproject.toml"
    tags:
      - "*"

  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/pypi_publisher.yml"
      - "MANIFEST.in"
      - "pyproject.toml"

  # dry run: builds and checks the distributions, publishes only from a tag
  workflow_dispatch:

# Globals
env:
  PYTHON_VERSION: "3.14"

# Jobs definition
jobs:
  build:
    name: "📦 Build distributions"
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Get source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install -U build twine

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distributions metadata
        run: python -m twine check --strict dist/*

      # PyPI never accepts the same version twice: refuse to publish a tag
      # which doesn't match the version declared in dicogis/__about__.py
      - name: Check that the git tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import os
          import sys
          from pathlib import Path

          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          tag_version = Version(os.environ["TAG"])
          (wheel,) = Path("dist").glob("*.whl")
          built_version = parse_wheel_filename(wheel.name)[1]
          if tag_version != built_version:
              sys.exit(
                  f"Tag {tag_version} does not match the built version "
                  f"{built_version}: fix dicogis/__about__.py or the tag."
              )
          print(f"Tag and built version match: {built_version}")
          EOF

      - name: Save distributions as artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: "🚀 Publish to PyPI"
    runs-on: ubuntu-latest
    needs: build

    if: startsWith(github.ref, 'refs/tags/')

    environment:
      name: pypi
      url: https://pypi.org/p/dicogis

    permissions:
      # PyPI Trusted Publishing (OIDC): no API token stored in the repository
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
