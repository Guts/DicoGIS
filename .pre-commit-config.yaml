exclude: "^(\\.venv[^/]*|build|dist|tests/dev|tests/fixtures)/|(^|/)__pycache__/"
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: name-tests-test
        args:
          - --pytest-test-first
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.10"
    hooks:
      # applies the safe fixes, then fails on whatever is left: the rules are
      # those of [tool.ruff] in pyproject.toml. Deliberate exceptions carry a
      # `# noqa: <rule>` comment saying why.
      - id: ruff-check
        types_or:
          - pyi
          - python
        args:
          - --fix
      - id: ruff-format
        types_or:
          - pyi
          - python

ci:
  autofix_prs: true
  autoupdate_schedule: quarterly
