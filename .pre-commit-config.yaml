exclude: ".venv|build|dist|__pycache__|tests/dev/|tests/fixtures/"
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=500
      - id: check-ast
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: name-tests-test
        args:
          - --pytest-test-first
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args:
          - --py310-plus

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.10"
    hooks:
      - id: ruff-check
        types_or:
          - pyi
          - python
        args:
          - --fix-only
      # the hook above only applies fixes: this one fails on any os.path (and
      # other os/open) usage pathlib can replace. Deliberate exceptions carry
      # a `# noqa: PTHxxx` comment saying why.
      - id: ruff-check
        name: ruff check (pathlib only)
        alias: ruff-pathlib
        types_or:
          - pyi
          - python
        args:
          - --select=PTH
      - id: ruff-format
        types_or:
          - pyi
          - python

ci:
  autofix_prs: true
  autoupdate_schedule: quarterly
